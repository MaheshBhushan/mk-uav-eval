name: ci
on: [push, pull_request]
permissions:
  contents: read
jobs:
  eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv python install 3.12
      - run: uv sync --extra cpu --extra dev
      # The full datasets are DVC-tracked on MinIO. CI fetches the 50-image
      # VisDrone / 20-image ICG subset through a short-lived presigned-URL
      # manifest (repo variable SUBSET_MANIFEST_URL) and holds no MinIO
      # credentials. Without the variable it uses the committed copy.
      - name: fetch dataset subset
        env:
          SUBSET_MANIFEST_URL: ${{ vars.SUBSET_MANIFEST_URL }}
        run: |
          if [ -n "$SUBSET_MANIFEST_URL" ]; then
            uv run python scripts/fetch_presigned.py "$SUBSET_MANIFEST_URL" --dest data/
          else
            cp -r data/ci_subset/. data/
          fi
      # Models are release assets, not git blobs.
      - run: gh release download models-v1 -p "*.onnx" -D models/
        env:
          GH_TOKEN: ${{ github.token }}
      - run: uv run pytest -q
      - run: uv run mkuav report --subset 50 --backend ort --out report.md --json metrics.json --json-dir stages
      - run: head -80 report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: eval-report
          path: |
            report.md
            metrics.json
            stages/
