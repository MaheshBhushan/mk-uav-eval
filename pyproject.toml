[project]
name = "mk-uav-eval"
version = "0.1.0"
description = "OpenCV evaluation harness for versioned UAV datasets"
requires-python = ">=3.12,<3.13"
dependencies = [
    "numpy>=1.26",
    "opencv-python-headless>=4.10",
    "onnxruntime>=1.18",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pycocotools>=2.0.7",
    "torchmetrics>=1.4",
    "torch>=2.3",
    "dvc>=3.50",
    "gdown>=5",
    "onnxruntime-openvino>=1.18",
]

[project.scripts]
mkuav = "mkuav.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mkuav"]

[tool.pytest.ini_options]
testpaths = ["tests"]
